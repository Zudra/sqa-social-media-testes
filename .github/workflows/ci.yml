name: CI

# Roda toda a suíte de testes sempre que um PR para a main é aberto ou atualizado.
# O workflow_dispatch permite disparar manualmente pela aba Actions.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Um novo push no mesmo PR cancela a execução anterior que ainda estiver rodando
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-unit:
    name: API - JUnit, MockMvc e Mockito
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Usa o H2 em memória (src/test/resources), não precisa de MySQL
      - name: Executar testes
        run: ./mvnw -B test

      - name: Publicar relatórios do Surefire
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-surefire-reports
          path: api/target/surefire-reports/
          if-no-files-found: ignore

  client-unit:
    name: Client - Jest e Testing Library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # A camada HTTP é mockada, não precisa da API rodando
      - name: Executar testes
        run: npm test -- --ci

  e2e:
    name: E2E e API - Playwright
    runs-on: ubuntu-latest
    needs: [api-unit, client-unit]
    env:
      API_URL: http://localhost:8080
      FRONT_URL: http://localhost:3000

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            tests/package-lock.json

      - name: Instalar dependências do client
        working-directory: client
        run: npm ci

      - name: Instalar dependências dos testes
        working-directory: tests
        run: npm ci

      - name: Instalar o Chromium do Playwright
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Build da API
        working-directory: api
        run: ./mvnw -B -DskipTests package

      - name: Iniciar a API
        working-directory: api
        run: |
          nohup java -jar target/demo-0.0.1-SNAPSHOT.jar \
            --spring.datasource.url=jdbc:mysql://localhost:3306/social_media \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            --spring.jpa.show-sql=false \
            > "$RUNNER_TEMP/api.log" 2>&1 &

      # Modo dev, igual ao usado localmente: os testes E2E contam com o StrictMode
      # do React executando os efeitos duas vezes (ver e2e/curtidas.spec.ts)
      - name: Iniciar o client
        working-directory: client
        env:
          NEXT_PUBLIC_BASE_URL: ${{ env.API_URL }}
        run: nohup npm run dev -- -p 3000 > "$RUNNER_TEMP/client.log" 2>&1 &

      - name: Aguardar API e client
        run: |
          for i in $(seq 1 90); do
            if curl -sf "$API_URL/posts?limit=1" > /dev/null && curl -sf "$FRONT_URL" > /dev/null; then
              echo "API e client prontos"
              exit 0
            fi
            sleep 2
          done
          echo "API ou client não subiram a tempo"
          tail -n 50 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/client.log"
          exit 1

      # Em modo dev cada página é compilada no primeiro acesso; acessar antes
      # evita que essa compilação estoure o timeout dos primeiros testes
      - name: Pré-compilar as páginas do client
        run: |
          for rota in / /signin /signup /auth/liked /reset-password; do
            curl -sf -o /dev/null "$FRONT_URL$rota" && echo "ok $rota"
          done

      - name: Executar testes E2E e de API
        working-directory: tests
        run: npm test

      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
            tests/test-results/
          if-no-files-found: ignore

      - name: Publicar logs da aplicação
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-logs
          path: |
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/client.log
          if-no-files-found: ignore
